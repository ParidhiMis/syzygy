<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Syzygy - Login</title>

    <link rel="stylesheet" href="auth.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Syzygy</h1>
      <h2>Login</h2>
      <p class="subtitle">A new way of doing what you love!</p>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required />

        <input type="password" id="password" placeholder="Password" required />

        <button type="submit">Login</button>
      </form>

      <p class="bottom-text">
        Oh wait! Are you new here?
        <a href="register.html">Register now!</a>
      </p>
    </div>

    <script src="api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
