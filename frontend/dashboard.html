<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Syzygy Dashboard</title>

    <link rel="stylesheet" href="dashboard.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- Calendar Panel -->
      <div class="calendar-panel">
        <h2>Calendar</h2>

        <p>Coming soon</p>
      </div>

      <!-- Calendar Toggle Button -->
      <div class="toggle-btn" id="calendar-btn">❮</div>

      <!-- Slide Menu -->
      <!-- Slide Menu -->
      <div class="sidebar" id="sidebar">
        <h2>Looking for something?</h2>

        <div class="sidebar-item">Profile</div>

        <div class="sidebar-item">Settings</div>

        <div class="sidebar-item">About Us</div>

        <div class="sidebar-item">Log Out</div>
      </div>
      <!-- Main Section -->
      <div class="main">
        <!-- Top Right -->
        <div class="top-bar">
          <div class="profile-icon" id="profile-btn">
            <img
              src="https://cdn-icons-png.flaticon.com/512/9131/9131529.png"
              class="profile-pic"
            />
          </div>

          <div class="menu-btn" id="menu-btn">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- Center -->
        <div class="center">
          <h1 id="welcome-text"></h1>

          <p class="discover-text">What did you discover today?</p>

          <button id="plus-btn">+</button>

          <p class="quote">Record your thoughts.</p>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
