<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syzygy Dashboard</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="dashboard">
      <h1 class="dashboard-logo">Syzygy ✦</h1>

      <h2 class="dashboard-title">What are we tracking today?</h2>

      <p class="dashboard-subtitle">Pick a category to begin ✨</p>

      <div class="grid">
        <div class="category-card" data-category="Books">
          <span>📚</span>
          <h3>Books</h3>
        </div>

        <div class="category-card" data-category="Movies">
          <span>🎬</span>
          <h3>Movies</h3>
        </div>

        <div class="category-card" data-category="TV Shows">
          <span>📺</span>
          <h3>TV Shows</h3>
        </div>

        <div class="category-card" data-category="Anime">
          <span>🍥</span>
          <h3>Anime</h3>
        </div>

        <div class="category-card" data-category="Webcomics">
          <span>📖</span>
          <h3>Webcomics</h3>
        </div>

        <div class="category-card" data-category="Albums">
          <span>🎵</span>
          <h3>Albums</h3>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
