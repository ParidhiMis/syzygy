<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Syzygy Dashboard</title>

    <link rel="stylesheet" href="dashboard.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dashboard">
      <div class="calendar-panel"></div>

      <div class="toggle-btn" id="calendar-btn">
        <img src="images/calendar.svg" />
      </div>

      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <h2>Looking for something?</h2>

        <div class="sidebar-item" id="profile-sidebar">Profile</div>
        <div class="sidebar-item">Settings</div>
        <div class="sidebar-item">About Us</div>
        <div class="sidebar-item" id="logout-btn">Log Out</div>
      </div>

      <!-- Main -->
      <div class="main">
        <!-- Top Bar -->
        <div class="top-bar">
          <div class="search-container">
            <div class="filter-wrapper">
              <button id="filter-btn">
                <img src="images/filter.svg" alt="" />
              </button>

              <div class="filter-panel" id="filter-panel">
                <select id="type-filter">
                  <option value="">All Types</option>
                  <option>Movie</option>
                  <option>Series</option>
                  <option>Anime</option>
                  <option>Book</option>
                  <option>Game</option>
                </select>

                <select id="status-filter">
                  <option value="">All Status</option>
                  <option>Completed</option>
                  <option>Watching</option>
                  <option>Reading</option>
                  <option>Playing</option>
                  <option>Planned</option>
                  <option>Dropped</option>
                </select>

                <select id="rating-filter">
                  <option value="">Any Rating</option>
                  <option value="5">⭐⭐⭐⭐⭐</option>
                  <option value="4">⭐⭐⭐⭐+</option>
                  <option value="3">⭐⭐⭐+</option>
                  <option value="2">⭐⭐+</option>
                  <option value="1">⭐+</option>
                </select>

                <button id="clear-filters">Clear Filters</button>
              </div>
            </div>

            <input type="text" id="search-input" placeholder="Search..." />

            <button id="search-btn">
              <img src="images/search.svg" alt="Search" />
            </button>
          </div>

          <div class="profile-icon" id="profile-btn">
            <img
              src="https://cdn-icons-png.flaticon.com/512/9131/9131529.png"
              class="profile-pic"
            />
          </div>

          <div class="menu-btn" id="menu-btn">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- Center -->
        <div class="center">
          <h1 id="welcome-text"></h1>

          <p class="discover-text">What did you discover today?</p>

          <button id="plus-btn">+</button>

          <p class="quote">Record your thoughts.</p>

          <div id="entries-container"></div>
        </div>
      </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="calendar.js"></script>
  </body>
</html>
