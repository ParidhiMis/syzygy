<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syzygy - Register</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Syzygy</h1>
      <h2>Create an account and unlock the fun!</h2>

      <p class="subtitle">Your favorites are just a few clicks away ♡</p>

      <form id="register-form">
        <input type="text" id="username" placeholder="Username" required />

        <input type="email" id="email" placeholder="Email" required />

        <input type="password" id="password" placeholder="Password" required />

        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm Password"
          required
        />

        <button type="submit">Register</button>
      </form>

      <p class="bottom-text">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </div>

    <script src="register.js"></script>
  </body>
</html>
